name: Flex Gateway Release Tracker

on:
  schedule:
    # Daily tracker — 07:25 UTC = 09:25 Madrid (CEST, summer)
    # DST adjuster patches this line automatically each Oct/Mar
    - cron: "25 7 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send email even if no new releases (true/false)"
        required: false
        default: "false"

permissions:
  contents: write   # needed to commit snapshot.json, run_log.json, badge.json

jobs:
  track:
    name: Check for new Flex Gateway releases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Run tracker ─────────────────────────────────────────────────────
      - name: Run release tracker
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:  ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          FORCE_NOTIFY:   ${{ github.event.inputs.force_notify }}
          LOG_LEVEL:      INFO
        run: python scraper.py

      # ── 4. Commit updated files ────────────────────────────────────────────
      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.json run_log.json badge.json
          git add snapshot_archive.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m \
            "chore: tracker run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
