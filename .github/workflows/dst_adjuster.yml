name: DST Schedule Adjuster

on:
  schedule:
    # Last Sunday of October at 03:00 UTC → clocks go back → CET (UTC+1) → use 08:25 UTC
    - cron: "0 3 25-31 10 0"
    # Last Sunday of March at 03:00 UTC → clocks go forward → CEST (UTC+2) → use 07:25 UTC
    - cron: "0 3 25-31 3  0"

  workflow_dispatch:
    inputs:
      force_offset:
        description: "Force Madrid UTC offset: 1 (CET/winter) or 2 (CEST/summer)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  adjust:
    name: Adjust tracker cron for Madrid DST
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use PAT so we can push changes to workflow files
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Compute correct cron and patch tracker.yml
        shell: python3 {0}
        env:
          FORCE_OFFSET: ${{ github.event.inputs.force_offset }}
        run: |
          import os, re
          from datetime import datetime, timezone, timedelta

          # ── Determine Madrid UTC offset ───────────────────────────────────
          force = os.environ.get("FORCE_OFFSET", "").strip()
          if force in ("1", "2"):
              offset = int(force)
              source = f"forced via workflow_dispatch (offset={offset})"
          else:
              now = datetime.now(timezone.utc)
              def last_sunday(year, month):
                  import calendar
                  last_day = calendar.monthrange(year, month)[1]
                  d = datetime(year, month, last_day, 1, 0, tzinfo=timezone.utc)
                  while d.weekday() != 6:
                      d -= timedelta(days=1)
                  return d
              spring = last_sunday(now.year, 3)
              autumn = last_sunday(now.year, 10)
              offset = 2 if spring <= now < autumn else 1
              source = f"auto-detected (spring={spring.date()}, autumn={autumn.date()})"

          utc_hour = 9 - offset   # 07 for CEST, 08 for CET
          new_cron = f"25 {utc_hour} * * *"
          season   = "CEST (UTC+2)" if offset == 2 else "CET (UTC+1)"

          print(f"Madrid offset : UTC+{offset} — {season}")
          print(f"Source        : {source}")
          print(f"New cron      : {new_cron}  →  09:25 Madrid")

          # ── Patch tracker.yml ─────────────────────────────────────────────
          path = ".github/workflows/tracker.yml"
          text = open(path).read()

          patched = re.sub(
              r'(- cron:\s*")[^"]+(")',
              rf'\g<1>{new_cron}\g<2>',
              text
          )
          patched = re.sub(
              r'# Runs every day at \d+:\d+ UTC.*',
              f'# Runs every day at {utc_hour:02d}:25 UTC = 09:25 Madrid time ({season})',
              patched
          )

          if patched == text:
              print("No change needed — cron already correct.")
          else:
              open(path, "w").write(patched)
              print("tracker.yml patched.")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CHANGED={'true' if patched != text else 'false'}\n")
              f.write(f"NEW_CRON={new_cron}\n")
              f.write(f"SEASON={season}\n")

      - name: Commit and push updated schedule
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tracker.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit — schedule already correct."
          else
            git commit -m "chore: adjust cron to '${NEW_CRON}' for ${SEASON} DST transition"
            git push
            echo "✅ Schedule updated to: ${NEW_CRON} (${SEASON})"
          fi
